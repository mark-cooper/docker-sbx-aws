[tools]
biome = "2.5.10"
node = "24"

[tasks.build]
description = "Build and load one agent template"
run = "node scripts/sandbox.ts build"

[tasks.build_all]
description = "Build and load every agent template"
run = "node scripts/sandbox.ts build --all"

[tasks.check]
description = "Typecheck and run tests"
run = "npm run check"

[tasks.doctor]
description = "Check runtime, profile, network policy, and direct role assumption"
run = "node scripts/sandbox.ts doctor"

[tasks.lint-fix]
description = "Apply biome fixes"
run = ['biome check --write']

[tasks.preview]
description = "Resolve profile metadata without contacting AWS or Docker"
run = "node scripts/sandbox.ts preview"

[tasks.sbx]
description = "sbx, with a restricted AWS session for run/rm of managed sandboxes; other commands pass through"
run = "node scripts/sandbox.ts sbx"
